<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Theme toggle: CSS prefers-color-scheme handles system preference.
    // This script adds a manual toggle that persists in localStorage.
    var body = document.querySelector("body");
    var stored = localStorage.getItem("theme");

    if (stored === "dark" || (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      body.classList.add("dark-mode");
    }

    // Author name → resume link
    var authorName = document.querySelector("h3.author__name");
    if (authorName) {
      var innerLink = authorName.querySelector("a.u-url");
      if (innerLink) {
        innerLink.replaceWith(...innerLink.childNodes);
      }
      if (!authorName.closest("a[href='/resume/']")) {
        var link = document.createElement("a");
        link.href = "/resume/";
        link.style.textDecoration = "none";
        link.style.color = "inherit";
        authorName.parentNode.insertBefore(link, authorName);
        link.appendChild(authorName);
      }
    }
  });
</script>
