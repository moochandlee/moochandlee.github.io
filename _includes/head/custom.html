<script>
  document.addEventListener("DOMContentLoaded", function() {
    var now = new Date();
    var hour = now.getHours();
    var body = document.querySelector("body");
    if (hour >= 18 || hour < 7) {
      body.classList.add("dark-mode");
    }
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    var authorName = document.querySelector("h3.author__name");
    if (authorName && !authorName.closest("a")) {
      var link = document.createElement("a");
      link.href = "/resume/";
      link.style.textDecoration = "none";
      link.style.color = "inherit";
      authorName.parentNode.insertBefore(link, authorName);
      link.appendChild(authorName);
    }
  });
</script>
<style>
  body.dark-mode {
    background-color: #111111 !important;
    color: #ffffff !important;
  }

  /* Masthead — target every element inside it */
  body.dark-mode .masthead,
  body.dark-mode .masthead__inner-wrap,
  body.dark-mode nav.greedy-nav,
  body.dark-mode .greedy-nav,
  body.dark-mode .greedy-nav .visible-links,
  body.dark-mode .greedy-nav__toggle {
    background-color: #111111 !important;

  }

  /* Site title and subtitle */

  body.dark-mode .masthead .site-title a {
    color: #ffffff !important;
    background-color: transparent !important;
  }

  /* Nav links in masthead */
  body.dark-mode .greedy-nav a,
  body.dark-mode .greedy-nav .visible-links a {
