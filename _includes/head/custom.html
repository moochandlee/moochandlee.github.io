<script>
  document.addEventListener("DOMContentLoaded", function() {
    var now = new Date();
    var hour = now.getHours();
    var body = document.querySelector("body");

    // Define 'Dark' hours (6 PM to 7 AM)
    if (hour >= 18 || hour < 7) {
      body.classList.add("dark-mode");
    }
  });
</script>

<style>
  /* Global Dark Mode Styling */
  body.dark-mode {
    background-color: #111111 !important;
    color: #ffffff !important; /* Pure white for better readability */
  }

  /* Fix Header (Masthead) Visibility */
  body.dark-mode .masthead {
    background-color: #111111 !important;
    border-bottom: 1px solid #333333 !important;
  }

  /* Site Title and Subtitle Styling */
  body.dark-mode .site-title, 
  body.dark-mode .site-title a,
  body.dark-mode .site-subtitle {
    color: #ffffff !important; /* Changes text from invisible to white */
  }

  /* Vibrant Blue for Interactive Elements */
  body.dark-mode a,
  body.dark-mode .nav__items a,
  body.dark-mode .sidebar a {
    color: #007bff !important; /* Vibrant Financial Blue */
    font-weight: 500;
  }

  body.dark-mode a:hover {
    color: #00aaff !important; /* Brighter blue on hover */
    text-decoration: underline;
  }

  /* Post Titles and Headings */
  body.dark-mode .archive__item-title a,
  body.dark-mode .page__title,
  body.dark-mode h1, body.dark-mode h2, body.dark-mode h3 {
    color: #ffffff !important;
  }

  /* Clean up Footer and Sidebar */
  body.dark-mode .page__footer,
  body.dark-mode .sidebar {
    background-color: #111111 !important;
    color: #ffffff !important;
    border: none !important;
  }
</style>
